[package]
name = "noted-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tar = "0.4"

[dependencies]
axum = "0.8"
rand = "0.9"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
url = "2"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
